<title id="title">Agent Skill Bundle — 174 reviewed skill directories</title>
<desc id="desc">Dark neon illustration showing the shared agent-skill source vault, three supported coding hosts, two native bootstraps, and 172 on-demand skills. Retrieval MCP is configured separately.</desc>
