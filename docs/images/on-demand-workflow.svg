<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="370" viewBox="0 0 1440 370" role="img" aria-labelledby="title desc">
<title id="title">How strict on-demand skill loading works</title>
<desc id="desc">Three-step workflow: install only two native bootstraps, use separately configured local Skill Retrieval MCP to search 172 on-demand entries, and read the chosen complete skill from the source checkout.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b172a"/><stop offset="1" stop-color="#101027"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59e6f4"/><stop offset=".5" stop-color="#8b8aff"/><stop offset="1" stop-color="#58ddbb"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1440" height="370" rx="24" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1437" height="367" rx="22.5" fill="none" stroke="#3c5276" stroke-width="2"/>
<text x="52" y="58" font-family="Segoe UI,Arial,sans-serif" fill="#f1f6ff" font-size="31" font-weight="800">How strict on-demand works</text>
<text x="52" y="89" font-family="Segoe UI,Arial,sans-serif" fill="#98aecb" font-size="18">A small native entry point. One reviewed source vault. Relevant skills only.</text>
<path d="M380 212h100m-14-10l14 10-14 10m336-10h100m-14-10l14 10-14 10" stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Segoe UI,Arial,sans-serif">
 <rect x="50" y="119" width="330" height="172" rx="18" fill="#12253e" stroke="#3c89aa" stroke-width="2"/>
 <rect x="71" y="140" width="48" height="48" rx="14" fill="#164a61"/><text x="95" y="173" fill="#6fe7f5" text-anchor="middle" font-size="26" font-weight="800">01</text>
 <text x="136" y="164" fill="#ecfaff" font-size="24" font-weight="800">Two bootstraps</text>
 <text x="75" y="213" fill="#b9d1eb" font-size="18">i-have-adhd</text>
 <text x="75" y="241" fill="#b9d1eb" font-size="18">skill-retrieval-routing</text>
 <text x="75" y="271" fill="#6fe7f5" font-size="14" font-weight="700">ONLY 2 NATIVE SKILL ENTRIES</text>
 <rect x="480" y="119" width="322" height="172" rx="18" fill="#1b2142" stroke="#827ddd" stroke-width="2"/>
 <rect x="501" y="140" width="48" height="48" rx="14" fill="#373262"/><text x="525" y="173" fill="#bbb0ff" text-anchor="middle" font-size="26" font-weight="800">02</text>
 <text x="567" y="164" fill="#f1efff" font-size="24" font-weight="800">Search local vault</text>
 <text x="503" y="213" fill="#c9c5ed" font-size="18">172 on-demand entries</text>
 <text x="503" y="242" fill="#c9c5ed" font-size="16">Find the skill relevant to the task</text>
 <text x="503" y="272" fill="#baafff" font-size="14" font-weight="700">SEPARATE LOCAL MCP SETUP</text>
 <rect x="902" y="119" width="486" height="172" rx="18" fill="#103137" stroke="#429988" stroke-width="2"/>
 <rect x="923" y="140" width="48" height="48" rx="14" fill="#175347"/><text x="947" y="173" fill="#72eed0" text-anchor="middle" font-size="26" font-weight="800">03</text>
 <text x="989" y="164" fill="#ebfff7" font-size="24" font-weight="800">Load the selected skill</text>
 <text x="925" y="213" fill="#c1e2dd" font-size="18">SKILL.md + references and examples</text>
 <text x="925" y="241" fill="#c1e2dd" font-size="18">Scripts and assets stay with their source</text>
 <text x="925" y="272" fill="#71e9c6" font-size="14" font-weight="700">FULL SUPPORTING FILES PRESERVED</text>
</g>
<path d="M53 323H1387" stroke="#324967" stroke-width="1.5"/>
<circle cx="69" cy="342" r="4" fill="#5bdcce"/>
<text x="83" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#9eb6cf">No bulk native loading</text>
<circle cx="363" cy="342" r="4" fill="#8883ef"/>
<text x="377" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#9eb6cf">No automatic service or credential setup</text>
<text x="1387" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#7794b8" text-anchor="end">AGENT SKILL BUNDLE</text>
</svg>