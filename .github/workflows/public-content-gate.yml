name: Public content safety
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public repository contents
        run: python3 scripts/public_repo_gate.py .
      - name: Verify canonical source and external runtime boundaries
        run: python3 tests/verify-source-boundaries.py
      - name: Verify zax-editor adapter
        run: python3 tests/verify-zax-editor-adapter.py
      - name: Verify offline discovery and selective external packages
        run: python3 tests/verify-skill-doctor.py
      - name: Verify complete and on-demand installations
        run: bash tests/on-demand-install.sh
      - name: Verify Agent project project bootstrap
        run: bash tests/agent-project-bootstrap.sh
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agent-skill-bundle
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
