name: Public content safety
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public repository contents
        run: python3 scripts/public_repo_gate.py .
      - name: Verify canonical source and external runtime boundaries
        run: python3 tests/verify-source-boundaries.py
      - name: Verify portable video editor adapter
        run: python3 tests/verify-video-editor-adapter.py
      - name: Verify offline discovery and selective external packages
        run: python3 tests/verify-skill-doctor.py
      - name: Verify complete and on-demand installations
        run: bash tests/on-demand-install.sh
